apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: logiq
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics-prom
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: logiq-backend
      containers:
        - name: backend
          image: logiq/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{ containerPort: 8000 }]
          env:
            - { name: APP_ENV, value: production }
            - { name: LLM_PROVIDER, value: openai }
            - { name: GEMINI_MODEL, value: gemini-3.8-flash }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: logiq-secrets, key: gemini-api-key, optional: true } }
            - { name: POSTGRES_HOST, value: postgres }
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: logiq-secrets, key: postgres-password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: logiq-secrets, key: jwt-secret } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: logiq-secrets, key: admin-password } }
            - name: INGEST_API_KEY
              valueFrom: { secretKeyRef: { name: logiq-secrets, key: ingest-api-key } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: logiq-secrets, key: openai-api-key } }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: logiq
spec:
  selector: { app: backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logiq-backend
  namespace: logiq
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logiq-actions
  namespace: logiq
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logiq-actions
  namespace: logiq
subjects:
  - kind: ServiceAccount
    name: logiq-backend
    namespace: logiq
roleRef:
  kind: Role
  name: logiq-actions
  apiGroup: rbac.authorization.k8s.io
