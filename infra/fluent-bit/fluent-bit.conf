[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# ------- INPUT: Docker container logs -------
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    DB                /tmp/flb_docker.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  5

# ------- INPUT: Nginx access logs -------
[INPUT]
    Name              tail
    Tag               nginx.access
    Path              /var/log/nginx/access.log
    Parser            nginx
    DB                /tmp/flb_nginx.db
    Mem_Buf_Limit     20MB

# ------- INPUT: Node.js apps via forward (apps push here) -------
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224

# ------- FILTER: enrich -------
[FILTER]
    Name          modify
    Match         *
    Add           ingested_by fluent-bit

[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

# ------- OUTPUT: send to LOGIQ backend -------
# /logs requires JWT in production; for dev we expose an internal token via env.
[OUTPUT]
    Name             http
    Match            *
    Host             backend
    Port             8000
    URI              /ingest/logs
    Format           json
    Json_date_key    timestamp
    Json_date_format iso8601
    Header           Authorization Bearer ${LOGIQ_INGEST_TOKEN}
    tls              off
    Retry_Limit      5
    Workers          1
